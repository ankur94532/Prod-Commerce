server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecom_auth}
    username: ${SPRING_DATASOURCE_USERNAME:ecom_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

security:
  jwt:
    # RS256 is required in deployed environments. The empty legacy secret exists only
    # for a short migration overlap with old no-kid HMAC tokens.
    secret: ${SECURITY_JWT_SECRET:}
    active-key-id: ${SECURITY_JWT_ACTIVE_KEY_ID:}
    private-key-base64: ${SECURITY_JWT_PRIVATE_KEY_BASE64:}
    public-key-base64: ${SECURITY_JWT_PUBLIC_KEY_BASE64:}
    previous-key-id: ${SECURITY_JWT_PREVIOUS_KEY_ID:}
    previous-public-key-base64: ${SECURITY_JWT_PREVIOUS_PUBLIC_KEY_BASE64:}
    # Short access tokens with a refresh endpoint, rather than one long-lived token.
    access-token-ttl: ${SECURITY_JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${SECURITY_JWT_REFRESH_TOKEN_TTL:7d}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: auth-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
# Run as a job before a rollout, not inside every starting pod:
#   SPRING_PROFILES_ACTIVE=migrate SPRING_FLYWAY_ENABLED=true <image>
# The service itself starts with Flyway disabled in deployed environments, and
# hibernate ddl-auto=validate stops it if the schema is behind its entities.
spring:
  config:
    activate:
      on-profile: migrate
  main:
    web-application-type: none
  flyway:
    enabled: true
  kafka:
    listener:
      auto-startup: false
