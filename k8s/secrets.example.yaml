# Copy this file to secrets.yaml, replace the values, and apply it separately.
# Do not commit real production secrets.
apiVersion: v1
kind: Secret
metadata:
  name: gocommerce-secrets
  namespace: gocommerce
type: Opaque
stringData:
  # One password per service role. There is no shared database credential any more.
  AUTH_DB_PASSWORD: "replace-with-auth-db-password"
  CATALOG_DB_PASSWORD: "replace-with-catalog-db-password"
  ORDER_DB_PASSWORD: "replace-with-order-db-password"
  ANALYTICS_DB_PASSWORD: "replace-with-analytics-db-password"
  RECOMMENDATION_DB_PASSWORD: "replace-with-recommendation-db-password"
  SECURITY_JWT_SECRET: "replace-with-at-least-32-character-jwt-secret"
  INTERNAL_SERVICE_TOKEN: "replace-with-at-least-32-character-internal-token"
