server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: order-service

  task:
    scheduling:
      pool:
        size: 2 # Recovery HTTP waits must not monopolize the outbox scheduler.

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecom_order}
    username: ${SPRING_DATASOURCE_USERNAME:ecom_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Checkout holds an order row lock across bounded catalog calls, so a connection is
      # occupied for the length of those calls. Pool exhaustion shows up as checkout
      # latency, not as database load: size and alert on it deliberately.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:3000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:20000}

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Stated explicitly: an outbox that publishes to a broker which may lose the write
      # is not a durable outbox. These are the current client defaults, but a default is
      # not a guarantee, and a future client or an override could silently weaken them.
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
    properties:
      spring.json.add.type.headers: false

orders:
  recovery:
    abandon-after-seconds: ${ORDERS_RECOVERY_ABANDON_AFTER_SECONDS:120}
    delay-ms: ${ORDERS_RECOVERY_DELAY_MS:5000}
  outbox:
    publisher-delay-ms: ${ORDERS_OUTBOX_PUBLISHER_DELAY_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      service: order-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:}
    active-key-id: ${SECURITY_JWT_ACTIVE_KEY_ID:}
    public-key-base64: ${SECURITY_JWT_PUBLIC_KEY_BASE64:}
    previous-key-id: ${SECURITY_JWT_PREVIOUS_KEY_ID:}
    previous-public-key-base64: ${SECURITY_JWT_PREVIOUS_PUBLIC_KEY_BASE64:}

services:
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://catalog-service:8082}
    internal-token: ${INTERNAL_SERVICE_TOKEN}
    connect-timeout: ${CATALOG_CLIENT_CONNECT_TIMEOUT:2s}
    read-timeout: ${CATALOG_CLIENT_READ_TIMEOUT:4s}

resilience4j:
  circuitbreaker:
    instances:
      catalogClient:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      paymentProvider:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      catalogClient:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
      catalogCompensation:
        max-attempts: 5
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
      paymentProvider:
        max-attempts: 2
        wait-duration: 300ms
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException

---
# Run as a job before a rollout, not inside every starting pod:
#   SPRING_PROFILES_ACTIVE=migrate SPRING_FLYWAY_ENABLED=true <image>
# The service itself starts with Flyway disabled in deployed environments, and
# hibernate ddl-auto=validate stops it if the schema is behind its entities.
spring:
  config:
    activate:
      on-profile: migrate
  main:
    web-application-type: none
  flyway:
    enabled: true
  kafka:
    listener:
      auto-startup: false
