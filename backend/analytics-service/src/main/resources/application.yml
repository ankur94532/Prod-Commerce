server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: analytics-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecom_analytics}
    username: ${SPRING_DATASOURCE_USERNAME:ecom_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
      # Emits spring_kafka_listener_seconds, which is what the dead-letter alert watches.
      observation-enabled: true
    consumer:
      enable-auto-commit: false
      group-id: analytics-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: false
        # Never project a record from a transaction that has not committed.
        isolation.level: read_committed
        spring.json.value.default.type: com.gocommerce.analytics.events.OrderCreatedEvent
        spring.json.trusted.packages: com.gocommerce.analytics.events

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: analytics-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}

gocommerce:
  consumer:
    # A poison record is retried this many times, then parked on <topic>.DLT so the
    # partition keeps moving. Alert on DLT depth: parked events are not processed events.
    retry-attempts: ${CONSUMER_RETRY_ATTEMPTS:5}
    retry-initial-interval: ${CONSUMER_RETRY_INITIAL_INTERVAL:1s}
    retry-multiplier: ${CONSUMER_RETRY_MULTIPLIER:2.0}
    retry-max-interval: ${CONSUMER_RETRY_MAX_INTERVAL:30s}
