server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: cart-service

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      # Redis is this service's store, not a cache, so a stalled Redis genuinely means no
      # carts. The bound is still needed: on Lettuce's 60-second default every request thread
      # sits blocked until the pool is exhausted, which turns a degraded dependency into a
      # dead service. Two seconds is generous for a store and short enough to shed load.
      #
      # Honest limit: unlike search-service's, this bound has not been exercised by a drill.
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:1s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: cart-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:}
    active-key-id: ${SECURITY_JWT_ACTIVE_KEY_ID:}
    public-key-base64: ${SECURITY_JWT_PUBLIC_KEY_BASE64:}
    previous-key-id: ${SECURITY_JWT_PREVIOUS_KEY_ID:}
    previous-public-key-base64: ${SECURITY_JWT_PREVIOUS_PUBLIC_KEY_BASE64:}
