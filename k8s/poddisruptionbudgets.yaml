# Without these, a node drain or cluster upgrade can remove every replica at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: gocommerce
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
---
