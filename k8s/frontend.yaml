# The shop itself. Everything else in k8s/ is an API; this is the only thing a shopper opens.
#
# It was absent entirely: the frontend existed as a Vite dev server in the README and nothing
# else, so a cluster brought up from these manifests served no user interface at all.
#
# Static files, so the pod is stateless and cheap: no database, no secrets, and nothing in the
# image that differs between environments. The API base URL is empty at build time and every
# call is a same-origin relative path through the same ingress, which is what keeps that true.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: gocommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The nginx-unprivileged image's own uid; it binds 8080 rather than 80 so no
        # capability to bind a privileged port is needed.
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: frontend
      containers:
        - name: frontend
          image: frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # nginx writes its pid and proxy buffers even when it only serves static files,
            # so a read-only root needs these two to be writable.
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: gocommerce
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
