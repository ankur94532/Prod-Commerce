global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Scraping without rules means telemetry is collected and nobody is ever paged.
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "api-gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["api-gateway:9090"]

  - job_name: "auth-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["auth-service:9090"]

  - job_name: "catalog-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["catalog-service:9090"]

  - job_name: "cart-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["cart-service:9090"]

  - job_name: "search-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["search-service:9090"]

  - job_name: "order-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["order-service:9090"]

  - job_name: "analytics-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["analytics-service:9090"]

  - job_name: "recommendation-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["recommendation-service:9090"]
