name: Docker Images

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    # Images used to publish on every push regardless of test results, because this
    # workflow packaged with -DskipTests and depended on nothing.
    name: Tests must pass before anything is published
    uses: ./.github/workflows/ci.yml

  build-images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            context: backend
            dockerfile: backend/auth-service/Dockerfile
          - service: catalog-service
            context: backend
            dockerfile: backend/catalog-service/Dockerfile
          - service: cart-service
            context: backend
            dockerfile: backend/cart-service/Dockerfile
          - service: api-gateway
            context: backend
            dockerfile: backend/api-gateway/Dockerfile
          - service: search-service
            context: backend
            dockerfile: backend/search-service/Dockerfile
          - service: analytics-service
            context: backend
            dockerfile: backend/analytics-service/Dockerfile
          - service: order-service
            context: backend
            dockerfile: backend/order-service/Dockerfile
          - service: recommendation-service
            context: backend
            dockerfile: backend/recommendation-service/Dockerfile
          - service: embedding-service
            context: backend/embedding-service
            dockerfile: backend/embedding-service/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
