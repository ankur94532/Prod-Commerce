server:
  port: ${SERVER_PORT:8087}
spring:
  application:
    name: recommendation-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecom_recommendation}
    username: ${SPRING_DATASOURCE_USERNAME:ecom_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
      # Emits spring_kafka_listener_seconds, which is what the dead-letter alert watches.
      observation-enabled: true
    consumer:
      enable-auto-commit: false
      group-id: recommendation-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.gocommerce.recommendation.events.OrderCreatedEvent

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: recommendation-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:}
    active-key-id: ${SECURITY_JWT_ACTIVE_KEY_ID:}
    public-key-base64: ${SECURITY_JWT_PUBLIC_KEY_BASE64:}
    previous-key-id: ${SECURITY_JWT_PREVIOUS_KEY_ID:}
    previous-public-key-base64: ${SECURITY_JWT_PREVIOUS_PUBLIC_KEY_BASE64:}
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN}

gocommerce:
  consumer:
    # A poison record is retried this many times, then parked on <topic>.DLT so the
    # partition keeps moving. Alert on DLT depth: parked events are not processed events.
    retry-attempts: ${CONSUMER_RETRY_ATTEMPTS:5}
    retry-initial-interval: ${CONSUMER_RETRY_INITIAL_INTERVAL:1s}
    retry-multiplier: ${CONSUMER_RETRY_MULTIPLIER:2.0}
    retry-max-interval: ${CONSUMER_RETRY_MAX_INTERVAL:30s}

---
# Run as a job before a rollout, not inside every starting pod:
#   SPRING_PROFILES_ACTIVE=migrate SPRING_FLYWAY_ENABLED=true <image>
# The service itself starts with Flyway disabled in deployed environments, and
# hibernate ddl-auto=validate stops it if the schema is behind its entities.
spring:
  config:
    activate:
      on-profile: migrate
  main:
    web-application-type: none
  flyway:
    enabled: true
  kafka:
    listener:
      auto-startup: false
