# Which services may open a socket to which store.
#
# The application NetworkPolicies in k8s/networkpolicies.yaml stop at the service tier, so
# until now nothing constrained the data tier -- any pod in the namespace could connect
# straight to PostgreSQL or Elasticsearch and skip every authorisation check the services
# perform. These policies are allowlists derived from what each service actually uses:
# analytics has no business reaching the search index, and search has no business reaching
# anyone's database.
#
# The same caveat as every other NetworkPolicy here: a cluster with no enforcing CNI accepts
# these objects and ignores them. ops/testing/networkpolicy-enforcement.sh reports which it
# is, and on docker-desktop the answer has been "ignored". Do not count this as isolation
# until that drill passes.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: gocommerce
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - auth-service
                  - catalog-service
                  - order-service
                  - analytics-service
                  - recommendation-service
        # Migration Jobs and the backup CronJob connect as themselves, not as a service.
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: migration
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backup
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: gocommerce
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  # cart-service stores carts here; search-service caches here; the gateway
                  # keeps rate-limiter buckets here.
                  - cart-service
                  - search-service
                  - api-gateway
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elasticsearch-ingress
  namespace: gocommerce
spec:
  podSelector:
    matchLabels:
      app: elasticsearch
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: search-service
      ports:
        - protocol: TCP
          port: 9200
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-ingress
  namespace: gocommerce
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - order-service
                  - analytics-service
                  - recommendation-service
        # The controller listener: the broker is its own quorum voter and must reach itself.
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 29093
