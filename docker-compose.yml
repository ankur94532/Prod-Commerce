services:
  postgres:
    image: postgres:16
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ecom_auth
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD in .env}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?set ORDER_DB_PASSWORD in .env}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?set ANALYTICS_DB_PASSWORD in .env}
      RECOMMENDATION_DB_PASSWORD: ${RECOMMENDATION_DB_PASSWORD:?set RECOMMENDATION_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    # Write-ahead log archiving, so recovery is not limited to the last logical dump.
    # ops/backup/pitr-drill.sh proves a restore to an arbitrary instant works.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /archive/%f && cp %p /archive/%f
      - -c
      - archive_timeout=60
      - -c
      - max_wal_senders=3
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgarchive:/archive
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # KRaft: ZooKeeper is removed in Kafka 4.x and deprecated before it, so a ZooKeeper
  # topology is already legacy. This is still a single broker for local development;
  # replication factor 1 means no redundancy, which is fine here and is NOT a production
  # topology. See docs/PRODUCTION-READINESS.md for what a real deployment requires.
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ecommerce-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-DAIQKLbNSSSxLaMmI2okqQ}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 12

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    container_name: ecommerce-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"

  redis:
    image: redis:7
    container_name: ecommerce-redis
    ports:
      - "6379:6379"

  embedding-service:
    build:
      context: ./backend/embedding-service
    container_name: ecommerce-embedding-service
    environment:
      EMBEDDING_MODEL_PATH: ${EMBEDDING_MODEL_PATH:-/models/bge-small-en-v1.5}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
    ports:
      - "8090:8090"
    volumes:
      - ./models:/models:ro
      - embedding-cache:/root/.cache/huggingface

  # The shop, served the way it is served in the cluster: nginx over the built bundle, not
  # the Vite dev server. Local development can still use `npm run dev`, but that path and the
  # deployed one had nothing in common, so a bug in the nginx configuration or the SPA
  # fallback could only ever be found in Kubernetes.
  frontend:
    build:
      context: ./frontend
      args:
        # Empty, matching the cluster: the gateway is reachable on the same origin through
        # the ingress there, and on localhost:8080 here.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL-http://localhost:8080}
    container_name: ecommerce-frontend
    ports:
      - "5173:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    healthcheck:
      # BusyBox wget resolves localhost to ::1 in this image, while nginx listens on IPv4.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ecommerce-alertmanager
    volumes:
      - ./ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Create these first; see ops/alertmanager/secrets/README.md.
      - ./ops/alertmanager/secrets:/etc/alertmanager/secrets:ro
    ports:
      - "9093:9093"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ecommerce-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/rules:/etc/prometheus/rules:ro
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    container_name: ecommerce-jaeger
    ports:
      - "16686:16686"
      - "4317"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: ecommerce-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./ops/otel/otel-collector-config.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      - jaeger
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    container_name: ecommerce-loki
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./ops/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.1
    container_name: ecommerce-promtail
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./ops/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: ecommerce-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  pgdata:
  pgarchive:
  kafka-data:
  embedding-cache:
  loki-data:
