# Schema migrations run here, once, before the services roll.
#
# They used to run inside every service's startup, which meant N replicas racing for the
# migration lock on every rolling deploy, a slow migration failing readiness across the
# fleet, and no separation between "deploy the code" and "change the schema".
#
# Apply these and wait for completion BEFORE applying the Deployments:
#   kubectl apply -k k8s/migrations
#   kubectl -n gocommerce wait --for=condition=complete job -l app.kubernetes.io/component=migration --timeout=10m
#   kubectl apply -k k8s
#
# Each job carries the image tag of the release being deployed, so the overlay rewrites it
# alongside the Deployments. Migrations must be backward compatible with the currently
# running version: expand first, contract in a later release, never both at once.
#
# Each Job also carries the Secrets its own Deployment carries. That is not belt-and-braces:
# a Job runs the service's image, so Spring builds the service's whole application context,
# including the beans that read INTERNAL_SERVICE_TOKEN and the JWT verifier configuration.
# Without them the context fails to refresh, the Job crash-loops, and the documented release
# procedure -- apply the migrations, wait for completion, then roll -- waits forever on a
# condition that will never be met. ops/testing/data-tier-deploy.sh caught exactly that for
# auth, catalog and order; analytics and recommendation happened to have no such beans and
# completed, which is what made it look like a per-service quirk rather than a manifest gap.
#
# auth-service's Job also carries the signing key, which deserves an explicit defence rather
# than silence. Nothing in a migration issues a token, so on least-privilege grounds it does
# not belong there. The alternative is to stop building the JwtIssuer bean under the migrate
# profile -- but AuthService takes it as a constructor argument, so excluding it cascades
# through the service and controller layer, and the usual dodge (@Lazy) moves key validation
# from startup to the first login. A malformed signing key failing at startup is worth more
# than the narrower blast radius here, particularly as the same pod already holds the auth
# database credentials, which read password hashes. Revisit if the issuer is ever separable.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: auth-service-migrate
  namespace: gocommerce
  labels:
    app.kubernetes.io/component: migration
    app: auth-service
spec:
  backoffLimit: 2
  # Keep finished jobs briefly so a failed migration can be read before it disappears.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: auth-service-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: auth-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: auth-service:latest
          imagePullPolicy: IfNotPresent
          args: ["--spring.profiles.active=migrate"]
          envFrom:
            - configMapRef:
                name: gocommerce-config
            - secretRef:
                name: gocommerce-jwt-verifier
            - secretRef:
                name: gocommerce-jwt-signer
          env:
            - name: SPRING_FLYWAY_ENABLED
              value: "true"
            - name: SPRING_DATASOURCE_USERNAME
              value: auth_service
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gocommerce-auth-db
                  key: AUTH_DB_PASSWORD
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: gocommerce-config
                  key: AUTH_DATASOURCE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
