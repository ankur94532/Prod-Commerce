# One identity per service. None of them call the Kubernetes API, so no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: gocommerce
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  namespace: gocommerce
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-service
  namespace: gocommerce
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cart-service
  namespace: gocommerce
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: search-service
  namespace: gocommerce
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service
  namespace: gocommerce
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-service
  namespace: gocommerce
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recommendation-service
  namespace: gocommerce
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: embedding-service
  namespace: gocommerce
automountServiceAccountToken: false
---
# The frontend serves static files and calls nothing in the cluster API; the token is not
# mounted, and this exists only so the Deployment does not fall back to "default".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: gocommerce
automountServiceAccountToken: false
