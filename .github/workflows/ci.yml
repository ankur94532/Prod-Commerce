name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Callable so the image workflow can require these checks before publishing.
  workflow_call:

jobs:
  backend-tests:
    name: Backend unit and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        run: mvn -f backend/pom.xml verify

  checkout-reliability:
    # These are the failure-path tests: duplicate checkout submissions, idempotent
    # inventory reservations, compensation recovery, consumer deduplication. They need a
    # real PostgreSQL, so they silently skipped in the previous pipeline.
    name: Checkout reliability (PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run checkout reliability suite
        run: ops/testing/checkout-reliability.sh

  database-and-recovery:
    # These suites existed but nothing ran them automatically, which is the same failure
    # that let the checkout and Elasticsearch tests silently skip before: a check nobody
    # has to pass decays into a check that no longer passes.
    name: Database isolation, migrations, and recovery drills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Per-service database role isolation
        run: ops/testing/database-isolation.sh
      - name: Role migration for an existing database
        run: ops/testing/database-role-migration.sh
      - name: Schema migration job
        run: ops/testing/migration-job.sh
      - name: Point-in-time recovery drill
        run: ops/backup/pitr-drill.sh
      - name: Backup retention policy
        run: ops/testing/backup-retention.sh

  load-harness:
    # Verifies the load harness itself against a stub: regimes, determinism, and that a
    # request which never completes is counted as a failure.
    name: Load-test harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run load harness checks
        run: ops/testing/load-harness.sh

  chaos-drill:
    # Pauses Elasticsearch and Redis under a running search service. Unit tests assert how
    # the code handles a dependency that throws; this asserts what happens when one stops
    # answering, which is the failure shape production sees.
    name: Chaos drill (dependency faults)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run chaos drill (search dependencies)
        run: ops/testing/chaos-drill.sh
      # These three were written and then wired to nothing, so only the search drill would
      # ever have run again. Each guards a failure that looks like success -- a false empty
      # cart, a phantom order, an edge that stalls on a black-holed rate limiter -- and each
      # already caught a real defect once. They run here so the next regression is caught by
      # CI rather than by a shopper.
      - name: Run chaos drill (cart store)
        run: ops/testing/chaos-drill-cart.sh
      - name: Run chaos drill (order money path)
        run: ops/testing/chaos-drill-order.sh
      - name: Run chaos drill (gateway rate limiter)
        run: ops/testing/chaos-drill-gateway.sh

  deployment-drill:
    # Stands the whole system up from k8s/ in a self-deleting scratch namespace and checks
    # that all ten deployments start and serve. It needs a cluster, so it is gated on one
    # being configured rather than failing the build where none exists -- but it is declared
    # here so the gap is visible instead of the drill simply never running anywhere.
    name: Kubernetes deployment drill
    runs-on: ubuntu-latest
    if: vars.DEPLOYMENT_DRILL_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run deployment drill
        run: ops/testing/data-tier-deploy.sh
      # Same job, because it needs the same cluster: stand the system up, then drive real
      # writes through it. The thresholds assert that no step failed, not that any particular
      # throughput was reached -- CI hardware varies and a capacity number would be noise.
      - name: Run journey benchmark (write path)
        run: TARGET_RPS=5 BENCHMARK_DURATION=60s ops/testing/journey-benchmark.sh

  search-retrieval:
    # Retrieval contracts against a real Elasticsearch: filter parity across modes, sort
    # handling, RRF fusion and pagination.
    name: Search retrieval contracts (Elasticsearch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run retrieval contract suite
        run: ops/testing/search-retrieval.sh

  consumer-contracts:
    name: Consumer-driven HTTP contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run consumer and provider contract tests
        run: ops/testing/contracts.sh

  deployment-config:
    name: Deployment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render base, staging, production, migration, and seed manifests
        run: |
          kubectl apply --dry-run=client -k k8s
          kubectl apply --dry-run=client -k k8s/migrations
          kubectl apply --dry-run=client -k k8s/seeds
          kubectl apply --dry-run=client -k deploy/overlays/staging
          kubectl apply --dry-run=client -k deploy/overlays/staging-migrations
          kubectl apply --dry-run=client -k deploy/overlays/production
          kubectl apply --dry-run=client -k deploy/overlays/production-migrations
      - name: Verify ordered release orchestration
        run: ops/testing/deploy-procedure.sh

  evaluation-harness:
    name: Graded evaluation harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run evaluation harness tests
        run: ops/testing/search-evaluation.sh
      - name: Validate the shipped query set
        run: python3 backend/search-service/evaluation/graded_eval.py validate --queries backend/search-service/evaluation/queries.v1.json

  frontend:
    name: Frontend build, tests, and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npm test
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
