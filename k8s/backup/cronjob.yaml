# Nothing ran the backup scripts. A backup procedure nobody executes is a document, not a
# backup, so this schedules them and applies retention.
#
# Two honest limits of this manifest:
#  - The volume below lives in the same cluster as the database. That protects against
#    "someone dropped a table", not against losing the cluster or the storage backend. A
#    real deployment writes to object storage in another failure domain.
#  - The CronJob mounts gocommerce-backup-scripts, which is NOT in this file: generate it
#    from the tested scripts so the two cannot drift, then apply this manifest:
#      ops/backup/render-scripts-configmap.sh | kubectl apply -f -
#      kubectl apply -f k8s/backup/cronjob.yaml
#  - Restores are still not automatic. ops/backup/pg-restore-drill.sh and pitr-drill.sh
#    have to be run deliberately, and a backup nobody has restored is only a hope.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gocommerce-backups
  namespace: gocommerce
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gocommerce-wal-archive
  namespace: gocommerce
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gocommerce-backup
  namespace: gocommerce
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # A backup that silently stops running is the worst kind. Alert on
  # kube_cronjob_status_last_successful_time falling behind this schedule.
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: postgres:16
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  /scripts/pg-backup.sh "/backups/$(date -u +%Y%m%dT%H%M%SZ)"
                  BACKUP_DIR=/backups ARCHIVE_DIR=/archive KEEP_BACKUPS="${KEEP_BACKUPS}" \
                    /scripts/prune-archive.sh
              env:
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  value: postgres
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: gocommerce-secrets
                      key: BACKUP_PGPASSWORD
                - name: KEEP_BACKUPS
                  value: "7"
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: archive
                  mountPath: /archive
                - name: scripts
                  mountPath: /scripts
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: gocommerce-backups
            - name: archive
              persistentVolumeClaim:
                claimName: gocommerce-wal-archive
            - name: scripts
              configMap:
                name: gocommerce-backup-scripts
                defaultMode: 0555
