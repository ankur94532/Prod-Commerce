server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: search-service

  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: ${SPRING_DATA_REDIS_DATABASE:2}
      # Lettuce defaults to a 60-second command timeout. The chaos drill measured what that
      # means: a Redis that stops answering but keeps the connection open -- an overloaded
      # instance or a network partition, not a crash -- made one search take 120,035ms, because
      # the cache read and the cache write each waited out the full minute. The code already
      # treats a cache failure as a miss, but a hang is not a failure, so it never reached
      # that path.
      #
      # A cache read from an adjacent Redis is sub-millisecond. 250ms is far beyond any
      # healthy response and far below anything a shopper would wait for. Measured with the
      # cache stalled: 524ms end to end, against 120,035ms on the default.
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:250ms}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:500ms}

catalog:
  base-url: ${CATALOG_BASE_URL:http://localhost:8082}

recommendation:
  base-url: ${RECOMMENDATION_BASE_URL:http://localhost:8087}

embedding:
  base-url: ${EMBEDDING_SERVICE_BASE_URL:http://localhost:8090}
  dimensions: ${EMBEDDING_DIMENSIONS:384}

search:
  http:
    connect-timeout: ${SEARCH_HTTP_CONNECT_TIMEOUT:2s}
    read-timeout: ${SEARCH_HTTP_READ_TIMEOUT:5s}
  ann:
    num-candidates: ${SEARCH_ANN_NUM_CANDIDATES:100}
  hybrid:
    keyword-weight: ${SEARCH_HYBRID_KEYWORD_WEIGHT:1.0}
    vector-weight: ${SEARCH_HYBRID_VECTOR_WEIGHT:1.5}
  rrf:
    candidate-window: ${SEARCH_RRF_CANDIDATE_WINDOW:100}
    rank-constant: ${SEARCH_RRF_RANK_CONSTANT:60}
  collapse:
    # One result per product family, so a page cannot fill with six colours of one item.
    # Switchable because it changes what a page means: the evaluation harness runs both
    # settings against the same corpus, and neither is asserted to be better without that.
    enabled: ${SEARCH_COLLAPSE_ENABLED:true}
    field: ${SEARCH_COLLAPSE_FIELD:productFamily}
  indexing:
    batch-size: ${SEARCH_INDEXING_BATCH_SIZE:128}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      service: search-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      catalogClient:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

      searchCore:
        ignore-exceptions:
          - org.springframework.web.server.ResponseStatusException
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 50
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true

      recommendationClient:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

      reindexJob:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      catalogClient:
        max-attempts: 3
        wait-duration: 250ms
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
      recommendationClient:
        max-attempts: 2
        wait-duration: 150ms
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
      searchCore:
        max-attempts: 2
        wait-duration: 100ms
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - org.springframework.dao.TransientDataAccessException

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:}
    active-key-id: ${SECURITY_JWT_ACTIVE_KEY_ID:}
    public-key-base64: ${SECURITY_JWT_PUBLIC_KEY_BASE64:}
    previous-key-id: ${SECURITY_JWT_PREVIOUS_KEY_ID:}
    previous-public-key-base64: ${SECURITY_JWT_PREVIOUS_PUBLIC_KEY_BASE64:}
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN}
