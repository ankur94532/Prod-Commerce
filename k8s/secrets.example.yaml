# Example only. Prefer an external secret controller in a real cluster; never commit
# populated copies. Separate objects prevent an unrelated pod from receiving all secrets.
apiVersion: v1
kind: Secret
metadata:
  name: gocommerce-jwt-verifier
  namespace: gocommerce
type: Opaque
stringData:
  SECURITY_JWT_ACTIVE_KEY_ID: "replace-with-unique-key-id"
  SECURITY_JWT_PUBLIC_KEY_BASE64: "replace-with-x509-public-key-der-base64"
  SECURITY_JWT_PREVIOUS_KEY_ID: ""
  SECURITY_JWT_PREVIOUS_PUBLIC_KEY_BASE64: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: gocommerce-jwt-signer
  namespace: gocommerce
type: Opaque
stringData:
  # PKCS#8 DER as a single base64 line. Only auth-service references this Secret.
  SECURITY_JWT_PRIVATE_KEY_BASE64: "replace-with-pkcs8-private-key-der-base64"
---
apiVersion: v1
kind: Secret
metadata:
  name: gocommerce-internal-auth
  namespace: gocommerce
type: Opaque
stringData:
  INTERNAL_SERVICE_TOKEN: "replace-with-at-least-32-character-internal-token"
---
apiVersion: v1
kind: Secret
metadata:
  name: gocommerce-auth-db
  namespace: gocommerce
type: Opaque
stringData:
  AUTH_DB_PASSWORD: "replace-with-auth-db-password"
---
apiVersion: v1
kind: Secret
metadata:
  name: gocommerce-catalog-db
  namespace: gocommerce
type: Opaque
stringData:
  CATALOG_DB_PASSWORD: "replace-with-catalog-db-password"
---
apiVersion: v1
kind: Secret
metadata:
  name: gocommerce-order-db
  namespace: gocommerce
type: Opaque
stringData:
  ORDER_DB_PASSWORD: "replace-with-order-db-password"
---
apiVersion: v1
kind: Secret
metadata:
  name: gocommerce-analytics-db
  namespace: gocommerce
type: Opaque
stringData:
  ANALYTICS_DB_PASSWORD: "replace-with-analytics-db-password"
---
apiVersion: v1
kind: Secret
metadata:
  name: gocommerce-recommendation-db
  namespace: gocommerce
type: Opaque
stringData:
  RECOMMENDATION_DB_PASSWORD: "replace-with-recommendation-db-password"
