apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gocommerce-staging

resources:
  - ../../../k8s

images:
  - name: api-gateway
    newName: ghcr.io/OWNER/REPOSITORY/api-gateway
    newTag: sha-REPLACE_ME
  - name: auth-service
    newName: ghcr.io/OWNER/REPOSITORY/auth-service
    newTag: sha-REPLACE_ME
  - name: catalog-service
    newName: ghcr.io/OWNER/REPOSITORY/catalog-service
    newTag: sha-REPLACE_ME
  - name: cart-service
    newName: ghcr.io/OWNER/REPOSITORY/cart-service
    newTag: sha-REPLACE_ME
  - name: search-service
    newName: ghcr.io/OWNER/REPOSITORY/search-service
    newTag: sha-REPLACE_ME
  - name: order-service
    newName: ghcr.io/OWNER/REPOSITORY/order-service
    newTag: sha-REPLACE_ME
  - name: analytics-service
    newName: ghcr.io/OWNER/REPOSITORY/analytics-service
    newTag: sha-REPLACE_ME
  - name: recommendation-service
    newName: ghcr.io/OWNER/REPOSITORY/recommendation-service
    newTag: sha-REPLACE_ME
  - name: embedding-service
    newName: ghcr.io/OWNER/REPOSITORY/embedding-service
    newTag: sha-REPLACE_ME
  - name: frontend
    newName: ghcr.io/OWNER/REPOSITORY/frontend
    newTag: sha-REPLACE_ME

patches:
  - target:
      kind: Namespace
      name: gocommerce
    patch: |-
      - op: replace
        path: /metadata/name
        value: gocommerce-staging
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/progressDeadlineSeconds
        value: 600
      - op: add
        path: /spec/minReadySeconds
        value: 10
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
