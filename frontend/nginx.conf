server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # A single-page app owns its routes: /orders and /cart are React Router paths, not files.
    # Without this fallback every deep link and every refresh returns 404 from nginx, which
    # is the classic way an SPA looks fine until someone reloads the page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached: it names the hashed asset bundles, so a stale copy
    # points a browser at files a deploy has already removed. The hashed assets themselves
    # can be cached hard, because their names change when their contents do.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Its own liveness signal, not a route the app has to serve.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
