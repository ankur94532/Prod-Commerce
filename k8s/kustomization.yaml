# Base manifests. They carry a mutable ":latest" image tag, which is fine for a local
# cluster and is NOT acceptable for a deployment you have to reason about: you cannot tell
# what is running, and a rollback has nothing to roll back to.
#
# Deploy production through an overlay that pins the immutable tag CI published:
#   kubectl apply -k deploy/overlays/production
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gocommerce

resources:
  - namespace.yaml
  - configmap.yaml
  # The stores the ConfigMap points at. Previously absent, which made every manifest here
  # describe a deployment that could not start. A real cluster should use managed instances
  # instead: deploy/overlays/production-managed-data drops these and repoints the ConfigMap.
  - data-tier
  - serviceaccounts.yaml
  - api-gateway.yaml
  - frontend.yaml
  - auth-service.yaml
  - catalog-service.yaml
  - cart-service.yaml
  - search-service.yaml
  - order-service.yaml
  - analytics-service.yaml
  - recommendation-service.yaml
  - embedding-service.yaml
  - poddisruptionbudgets.yaml
  - horizontalpodautoscalers.yaml
  - networkpolicies.yaml
  - ingress.yaml
