# Explicit development/demo data load. Do not include this in a production rollout.
apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-service-seed
  namespace: gocommerce
  labels:
    app.kubernetes.io/component: seed
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: catalog-service-seed
    spec:
      restartPolicy: Never
      serviceAccountName: catalog-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: catalog-service:latest
          imagePullPolicy: IfNotPresent
          args: ["--spring.profiles.active=seed"]
          envFrom:
            - configMapRef:
                name: gocommerce-config
            # The same Secrets catalog-service's Deployment carries. A Job runs the service
            # image, so Spring builds the service's whole application context -- including
            # SearchIndexClient, which reads INTERNAL_SERVICE_TOKEN. Without them the context
            # fails to refresh and the seed crash-loops on an unresolved placeholder.
            #
            # This is the identical defect that was fixed in k8s/migrations/jobs.yaml. It
            # survived here because that fix was applied to the migration Jobs and this file
            # was never checked; it was found when a benchmark finally tried to seed a real
            # cluster. Any new Job running a service image needs the same treatment.
            - secretRef:
                name: gocommerce-jwt-verifier
            - secretRef:
                name: gocommerce-internal-auth
          env:
            - name: CATALOG_SEED_SIZE
              value: "1000"
            - name: SPRING_DATASOURCE_USERNAME
              value: catalog_service
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gocommerce-catalog-db
                  key: CATALOG_DB_PASSWORD
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: gocommerce-config
                  key: CATALOG_DATASOURCE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
