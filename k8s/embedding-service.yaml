apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-service
  namespace: gocommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embedding-service
  template:
    metadata:
      labels:
        app: embedding-service
    spec:
      serviceAccountName: embedding-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: embedding-service
      containers:
        - name: embedding-service
          image: embedding-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: gocommerce-config
          env:
            # The weights are baked into the image at a pinned revision, so this points at
            # them on disk. It used to pass only the model NAME with nothing on disk, which
            # meant every pod start tried to download from Hugging Face into a home
            # directory that readOnlyRootFilesystem makes unwritable -- and, had it been
            # writable, an unpinned download would let the weights change without a deploy
            # and silently move every search result. See backend/embedding-service/Dockerfile.
            - name: EMBEDDING_MODEL_PATH
              value: "/models/bge-small-en-v1.5"
            - name: EMBEDDING_MODEL_NAME
              value: "BAAI/bge-small-en-v1.5"
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: embedding-service
  namespace: gocommerce
spec:
  type: ClusterIP
  selector:
    app: embedding-service
  ports:
    - name: http
      port: 8090
      targetPort: http
